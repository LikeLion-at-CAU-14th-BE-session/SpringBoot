# CD: main 브랜치에 push되면 jar를 빌드해서 EC2로 전송하고 재시작합니다.
name: Spring Boot CD to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 캐시 설정
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 실행 가능한 jar 빌드 (테스트는 ci.yml에서 이미 검증하므로 스킵)
      - name: Build bootJar
        run: ./gradlew bootJar -x test

      # 빌드된 jar를 EC2로 전송 (application-secret.yml은 건드리지 않음)
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*.jar"
          target: ${{ secrets.EC2_TARGET_DIR }}
          strip_components: 2

      # EC2에 접속해서 기존 프로세스 종료 후 새 jar로 재실행
      - name: Restart application on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # deployment,secret 프로필로 떠 있는 기존 프로세스를 찾아 정상 종료
            APP_PID=$(pgrep -f "spring.profiles.active=deployment,secret" || true)
            if [ -n "$APP_PID" ]; then
              echo "Stopping existing app (PID: $APP_PID)"
              kill -15 $APP_PID
              sleep 5
            fi

            cd ${{ secrets.EC2_TARGET_DIR }}
            JAR_FILE=$(ls -t *.jar | head -n 1)
            echo "Starting $JAR_FILE"
            nohup java -jar "$JAR_FILE" --spring.profiles.active=deployment,secret > app.log 2>&1 &
            disown
